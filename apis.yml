apis:
- name: effiPilot Platform API
  description: 'The HTTP API behind Accenta''s effiPilot building-energy platform. It is an
    RPC-style JSON surface — requests take the form /api/method/<methodName> — served per customer
    tenant from the wildcard accenta.ai host (nginx + PHP 8.0.30), with session-cookie
    authentication established through the platform login. The API reference is published by
    Accenta as "documentation API effiPilot" at /api/doc on the tenant host, but that route is only
    routed for an authenticated session; anonymous requests return {"message":"Route not found"}.
    One anonymous method is reachable and was verified: /api/method/brandConf, which returns the
    tenant brand, legal-entity, consent and colour configuration as JSON. No OpenAPI, Swagger,
    GraphQL or MCP contract is published on any Accenta host.'
  humanURL: https://app.accenta.ai/login/?redirectTo=api%2Fdoc
  baseURL: https://app.accenta.ai/api/
