aid: accenta
name: Accenta
description: 'Accenta is a French energy and carbon performance company for real estate portfolios,
  founded in 2016 and headquartered in Boulogne-Billancourt. It combines AI-driven building control
  (an intelligent building management system plus an Accenta Communication Box for sites with no BMS)
  with low-carbon heat and cold production built on shallow geothermal energy, inter-seasonal
  geostorage, heat pumps and solar, and it wraps the whole package in audit, design, build, operate,
  financing and performance-contract services. Accenta says it manages roughly 10 million square
  metres of real estate for owners such as Airbus, Prologis, Icade, Redevco and Decathlon, targeting
  energy reductions up to 80% and CO2 reductions up to 95%. Its software platform is effiPilot,
  acquired in 2020, delivered as a per-customer tenant on accenta.ai with a web application, an
  Android app and an HTTP API whose reference documentation sits behind the customer login.'
